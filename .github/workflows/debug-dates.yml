name: Debug Dates

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check several dates
        run: |
          for d in 2026-09-30 2026-10-05 2026-10-08 2026-10-10 2026-10-12; do
            echo "=== $d ==="
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" "https://api.amanopark.co.kr/api/web/setting/booking/check?date=$d&type=BASIC"
            echo
          done
