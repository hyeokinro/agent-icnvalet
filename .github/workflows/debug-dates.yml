name: Debug Dates

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check several dates
        run: |
          for d in 2026-09-20 2026-09-21 2026-09-22 2026-09-24 2026-09-26 2026-09-27; do
            echo "=== $d ==="
            curl -sS -w "\nHTTP_STATUS:%{http_code}\n" "https://api.amanopark.co.kr/api/web/setting/booking/check?date=$d&type=BASIC"
            echo
          done
